<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой простой сайт</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f5f5f5;
        color: #333;
      }
      header {
        background: #4a90e2;
        color: white;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      nav a {
        color: white;
        text-decoration: none;
        margin-right: 15px;
        font-weight: bold;
      }
      main {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      }
      footer {
        margin-top: 30px;
        text-align: center;
        font-size: 0.9em;
        color: #777;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Мой сайт</h1>
      <nav>
        <a href="#about">Обо мне</a>
        <a href="#services">Услуги</a>
        <a href="#contact">Контакты</a>
      </nav>
    </header>

    <main>
      <section id="about">
        <h2>Обо мне</h2>
        <p>Привет! Это мой первый сайт на HTML. Я учусь делать сайты и хочу показать, что уже умею.</p>
      </section>

      <section id="services">
        <h2>Что я делаю</h2>
        <ul>
          <li>Верстаю простые лендинги.</li>
          <li>Делаю адаптивные страницы.</li>
          <li>Настраиваю формы и кнопки.</li>
        </ul>
      </section>

      <section id="contact">
        <h2>Контакты</h2>
        <p>Email: example@mail.com</p>
        <p>Телефон: +7 (999) 000-00-00</p>
        <a href="mailto:example@mail.com" class="btn">Написать мне</a>
      </section>
    </main>

    <footer>
      &copy; 2024 Мой сайт. Все права защищены.
    </footer>
  </body>
</html>
